<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RollaWord - Ultra Compact Mobile</title>
  <link rel="stylesheet" href="assets/css/rollaword.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 1) Top Count-Down Timer -->
  <!-- 1) Top Count-Down Timer (Unified Flex Row Layout) -->
  <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: calc(var(--baseline) * 4) auto 0 auto; box-sizing: border-box;">
    <h1 id="game-title" class="h1" style="margin: 0; text-align: left; text-transform: uppercase;">ROLLAWORD</h1>
    <div id="timer-container" style="margin: 0; text-align: right;"><span id="timer-display">3:00</span></div>
  </header>


  <!-- 2) Playing board: 6 rows x 8 columns -->
  <div id="game-board"></div>

  <!-- White separation between board and dice tray -->
  <div id="board-separator"></div>

  <!-- Dice tray: 1 row x 8 columns -->
  <div id="dice-tray"></div>

<!-- 3) Unified Game Action Control Panels -->
<div id="action-container" style="width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: 10px auto;">
    
    <!-- 🚀 Startup Selection Row (Both buttons side-by-side) -->
    <div id="mode-selection-row" style="display: flex; gap: 8px; width: 100%; height: 45px;">
        <button id="start-btn" class="btn" style="flex: 1; height: 100%;" 
                onclick="window.isDailyChallengeMode = false; document.getElementById('game-title').textContent = 'FREE PLAY'; document.getElementById('mode-selection-row').style.display='none'; document.getElementById('done-btn-container').style.display='block'; if(typeof startGameEngine === 'function') startGameEngine();">
            FREE PLAY
        </button>
        <button id="challenge-start-btn" class="btn" style="flex: 1; height: 100%;" 
                onclick="window.isDailyChallengeMode = true; document.getElementById('game-title').textContent = 'DAILY CHALLENGE'; document.getElementById('mode-selection-row').style.display='none'; document.getElementById('done-btn-container').style.display='block'; if(typeof startChallengeEngine === 'function') startChallengeEngine();">
            DAILY CHALLENGE
        </button>
    </div>

    <!-- 🏁 Active Gameplay State Panel (Done Button) -->
    <div id="done-btn-container" style="display: none; width: 100%; height: 45px;">
        <button id="done-btn" class="btn" style="width: 100%; height: 100%;" 
                onclick="document.getElementById('game-title').textContent = 'ROLLAWORD'; document.getElementById('done-btn-container').style.display='none'; document.getElementById('mode-selection-row').style.display='flex'; if(typeof clearTimeoutEngine === 'function') clearTimeoutEngine();">
            Done
        </button>
    </div>
    <br>
    <!-- ℹ️ Game Guide Navigation Link Button -->
    <div id="guide-nav-container" style="width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: 0 auto calc(var(--baseline) * 3) auto; display: flex;">
        <a href="howTo.html" class="btn" style="flex: 1; justify-content: center; height: 40px; text-transform: uppercase; letter-spacing: 0.5px;">
            ❓ How To Play
        </a>
    </div>

</div>


 
<!-- 4) Bottom Plain Text Formula Scoring Output Box -->
<div id="score-output-area">
<div>Press 'FREE PLAY' or 'DAILY CHALLENGE'</div>
<div>to play</div>
</div>

<!-- 💰 Google AdSense Slot Unit Container -->
<div class="adsense-spacer" style="width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: 15px auto; display: flex; justify-content: center; overflow: hidden;">
    <ins class="adsbygoogle"
         style="display:inline-block;width:320px;height:50px"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>


<script src="assets/js/rollawordbonus.js"></script>
<script src="assets/js/rollawordisland.js"></script>
<script src="assets/js/rollaworddisplay.js"></script>
<script src="assets/js/rollawordscoring.js"></script>
<script src="assets/js/rollaworddictionary.js"></script>
<script src="assets/js/rollawordadult.js"></script> <!-- Swapped in -->
<script src="assets/js/rollaword.js"></script>
<!-- 🏆 New Firestore Leaderboard Module Layer -->
<script type="module" src="assets/js/rollawordleaderboard.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5517653304280747"
     crossorigin="anonymous"></script>
</body>
</html>
