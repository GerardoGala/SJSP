<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RollaWord - Ultra Compact Mobile</title>
  <link rel="stylesheet" href="assets/css/rollaword.css">
</head>
<body>

  <!-- 1) Top Count-Down Timer -->
  <header>
    <h1 class="h1">ROLLAWORD</h1>
    <div id="timer-container"><span id="timer-display">3:00</span></div>
  </header>

  <!-- 2) Centered Grid (8x8 Playfield + 1x8 Dice Tray Row integrated at bottom) -->
  <div id="grid-container" style="position: relative;"></div>

  <!-- 3) Instant Scoring Submission Button -->
  <div id="action-panel">
    <button id="done-btn" class="btn">Done</button>
  </div>

  <!-- 4) Bottom Plain Text Formula Scoring Output Box -->
  <div id="score-output-area">
    <div>Game Active...</div>
  </div>

  <script src="assets/js/rollawordbonus.js"></script>
  <script src="assets/js/rollaworddictionary.js"></script>
 <script src="assets/js/rollawordscoring.js"></script>
  <script src="/assets/js/rollaword.js"></script>
</body>
</html>
