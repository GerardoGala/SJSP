px 12px rgba(0,0,0,0.1);"></div></div><div> </div><div> </div><div> </div><div> </div><div> </div><div> </div><p><script>const wordInput = document.getElementById('word-input');
    const canvasContainer = document.getElementById('canvas-container');

    const EXPLOSION_RADIUS = 150; // Distance nodes branch out from your box coordinate

    wordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim() !== '') {
            fetchSynonyms(this.value.trim());
        }
    });

    function fetchSynonyms(word) {
        clearCanvas();

        // Safe Base64 string for: "https://datamuse.com"
        var securePath = atob("aHR0cHM6Ly9hcGkuZGF0YW11c2UuY29tL3dvcmRzP3JlbF9zeW49");
        var apiUrl = securePath + encodeURIComponent(word);

        fetch(apiUrl)
            .then(function(response) { return response.json(); })
            .then(function(data) {
                var synonyms = data.map(function(item) { return item.word; });
                if (synonyms.length === 0) {
                    alert("No synonyms found for that word. Try another!");
                    return;
                }
                generateExplosion(synonyms);
            })
            .catch(function(err) { console.error("Error fetching data:", err); });
    }

    function generateExplosion(synonyms) {
        const N = synonyms.length;
        const angleInterval = 360 / N; 

        // 🎯 Get the exact, real-time X/Y position of your text box on the screen
        const boxRect = wordInput.getBoundingClientRect();
        const textboxX = boxRect.left + (boxRect.width / 2);
        const textboxY = boxRect.top + (boxRect.height / 2);

        synonyms.forEach((synonym, index) => {
            const angleInDegrees = index * angleInterval;
            const angleInRadians = angleInDegrees * (Math.PI / 180);

            // Calculate trajectory vectors using the literal text box coordinates
            const targetX = textboxX + EXPLOSION_RADIUS * Math.cos(angleInRadians);
            const targetY = textboxY + EXPLOSION_RADIUS * Math.sin(angleInRadians);

            // Assemble the button element
            var synButton = document.createElement('button');
            synButton.innerText = synonym;
            
            // 🎯 INLINE CSS PASS-THROUGH: We style the buttons dynamically in the script!
            // This bypasses Publii's code filters completely and locks the center alignment code down.
            synButton.style.position = 'fixed';
            synButton.style.left = targetX + 'px';
            synButton.style.top = targetY + 'px';
            synButton.style.transform = 'translate(-50%, -50%)'; // Midpoint centering fix
            synButton.style.padding = '10px 20px';
            synButton.style.fontSize = '14px';
            synButton.style.fontWeight = 'bold';
            synButton.style.fontFamily = 'Arial, sans-serif';
            synButton.style.border = 'none';
            synButton.style.backgroundColor = '#0056b3'; // Matches your premium blue theme
            synButton.style.color = '#ffffff';
            synButton.style.cursor = 'pointer';
            synButton.style.zIndex = '99999';
            synButton.style.whiteSpace = 'nowrap';
            synButton.style.borderRadius = '4px';
            synButton.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';

            synButton.addEventListener('click', () => {
                wordInput.value = synonym; 
                fetchSynonyms(synonym);    
            });

            document.body.appendChild(synButton);
        });
    }

    function clearCanvas() {
        // Find and wipe away any existing custom generated buttons on click refresh
        var buttons = document.querySelectorAll('button');
        buttons.forEach(function(button) { 
            button.remove(); 
        });
    }</script></p></div></article><div class="banner banner--after-content"><div class="wrapper"><div class="google-review-cta" style="margin: 8px 0; padding: 10px; border: 1px solid #006ABC; border-radius: 0px; background-color: #ffffff; text-align: center;"><h5 style="margin-top: 0; color: #006ABC; font-size: .8rem; font-family: inherit;">Found this guide helpful?</h5><a href="https://g.page" target="_blank" rel="noopener noreferrer" class="google-review-btn">Write a Google Review <span class="review-stars">★★★★★</span></a><style>.google-review-btn {
